      <script>
   // Called after form input is processed
function startConnect() {
	
	//NearestHospital(22.761619, 75.885466);
	//alert(distance(22.733711, 75.890098, 22.748696, 75.894822, 'K'));
    // Generate a random client ID
    clientID = "clientID-" + parseInt(Math.random() * 659);

    // Fetch the hostname/IP address and port number from the form
    //host = document.getElementById("host").value;
    //port = document.getElementById("port").value;

    // Print output for the user in the messages div
    //document.getElementById("messages").innerHTML += '<span>Connecting to: ' + host + ' on port: ' + port + '</span><br/>';
    //document.getElementById("messages").innerHTML += '<span>Using the following client value: ' + clientID + '</span><br/>';

    // Initialize new Paho client connection
    client = new Paho.MQTT.Client('broker.emqx.io', 8083, clientID);

    // Set callback handlers
    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    // Connect the client, if successful, call onConnect function
    client.connect({ 
        onSuccess: onConnect,
    });
}

function PingUpdate()
{
	var message = new Paho.MQTT.Message("U");
	message.destinationName = "indore/announcement/msg";
	message.qos = 0; // Optional: 0, 1, or 2 (default is 0)
	client.send(message);

}
	
	function SendMessage(msg)
{
	var message = new Paho.MQTT.Message(msg);
	message.destinationName = "indore/announcement/msg";
	message.qos = 0; // Optional: 0, 1, or 2 (default is 0)
	client.send(message);

}

// Called when the client connects
function onConnect() {
	alert("Connected");
	console.log("Connected")
    // Fetch the MQTT topic from the form
    topic = 'indore/parking/#';

    // Print output for the user in the messages div
    //document.getElementById("messages").innerHTML += '<span>Subscribing to: ' + topic + '</span><br/>';

    // Subscribe to the requested topic
    client.subscribe(topic);
}

// Called when the client loses its connection
function onConnectionLost(responseObject) {
    console.log("onConnectionLost: Connection Lost");
    if (responseObject.errorCode !== 0) {
        console.log("onConnectionLost: " + responseObject.errorMessage);
    }
	client.connect({ 
        onSuccess: onConnect,
    });
}

// Called when the disconnection button is pressed
function startDisconnect() 
{
    client.disconnect();
    document.getElementById("messages").innerHTML += '<span>Disconnected</span><br/>';
    updateScroll(); // Scroll to bottom of window
}

// Updates #messages div to auto-scroll

{
    var element = document.getElementById("messages");
